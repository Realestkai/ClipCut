format = 2

[effect]
id = "clipcut.strobe"
name = "Strobe"
kind = "effect"
category = "Light"
order = 10
description = "Flashes of white or black on a steady beat, for a club or a drop."

[[param]]
key = "rate"
label = "Rate"
unit = "Hz"
min = 1
max = 20
step = 1
default = 6

[[param]]
key = "strength"
label = "Strength"
unit = "%"
min = 0
max = 100
step = 1
default = 70

[[param]]
key = "tone"
label = "Flash"
type = "enum"
values = [0, 1]
labels = ["White", "Black"]
default = 0
min = 0
max = 1

[wgsl]
entry = "effect.wgsl"
