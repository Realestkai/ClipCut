[package]
name = "clipcut-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The small dark window that installs a ClipCut update on Windows and starts the new version, in place of the setup wizard."

# Its own executable, beside clipcut.exe in the install folder. The app
# copies it out to the updates folder and starts it from there, so the
# setup it runs can replace everything in the install folder, this file
# included. It links nothing but Windows itself: no FFmpeg, no Slint, so it
# starts from wherever it is copied to and builds in seconds.
[[bin]]
name = "clipcut-updater"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
