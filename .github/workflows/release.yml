name: Release

# A push to main that changes the version in src/Cargo.toml is a release:
# this builds ClipCut for macOS (Apple silicon and Intel) and Windows and
# publishes a GitHub release tagged v<version>, with one installer per
# target, a manifest.json and a checksum file. A push that leaves the
# version at one already released builds nothing.
#
# To ship a new version: change `version` in src/Cargo.toml, commit, push.
#
# It runs on main, not on a tag, so that every release shares one build
# cache: GitHub lets a run read the caches of its own ref and of the
# default branch only, so a run on a tag starts cold every time, and a
# cold build is most of an hour. On main the dependencies - Skia, Slint,
# whisper, the FFmpeg bindings - are compiled once and reused.
#
# The bundles are self-contained: the macOS .dmg carries its FFmpeg dylibs
# and is notarised when the signing secrets are set (ad-hoc signed
# otherwise); the Windows installers carry the FFmpeg runtime libraries
# beside the program. Nothing is published until every bundle has been
# launched where it was built: build-app.yml starts each one (`--version`,
# `--smoke`, and on x86_64 under an emulated Ivy Bridge) before it uploads
# it, and a bundle that does not start fails its job, which `publish`
# needs. The test suite runs on every push to main (ci.yml), not again
# here.
#
# The release is published as soon as it is built, and that is what the
# in-app updater (Settings > Version) reads: every installed copy offers
# the new version from then on.
on:
  push:
    branches: [main]
    paths:
      - src/Cargo.toml
  # By hand, from the Actions page: releases the version on main if it has
  # not been released yet. For a release whose run failed.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this version released yet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::src/Cargo.toml's version '$version' is not three numbers (1.2.3)"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released: nothing to build."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag is not released yet: building it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The commit this run started on, named outright, so the bundles and the
  # tag the release creates are the same tree.
  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          pattern: ClipCut-*
          merge-multiple: true

      # The tree the release is cut from: the notes are read out of its
      # history, and the manifest out of its model table.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: source

      # One file that says where every other one is: a row per bundle with
      # its size and digest, and a row per model with the mirror it is
      # fetched from. An updater or a package script reads this instead of
      # guessing at asset names. See scripts/models.py.
      - name: Write the manifest
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          python3 source/scripts/models.py release-manifest \
            --version "$VERSION" \
            --tag "$TAG" \
            --bundles bundles \
            --out bundles/manifest.json
          cat bundles/manifest.json

      - name: Checksums
        run: |
          set -euo pipefail
          cd bundles
          ls -l
          sha256sum -- * > SHA256SUMS

      # The notes are the commits since the previous release; see the script.
      - name: Write the notes
        id: notes
        env:
          TAG: ${{ needs.check.outputs.tag }}
          # Whether a certificate signed the Windows bundles: build-app.yml
          # leaves them unsigned, and says so, when the secret is unset.
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
        run: |
          set -euo pipefail
          cd source
          tag="$TAG"
          # The tag does not exist yet - publishing creates it - so the
          # notes run from the last release's tag to this commit.
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          .github/release-notes.sh "$previous" HEAD "${tag#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Published as soon as it is built: the updater in every installed
      # copy reads the list of published releases, so this is the moment
      # an update is offered. See the top of this file.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          # The tag is created here, on the commit that was built.
          target_commitish: ${{ github.sha }}
          name: ClipCut ${{ needs.check.outputs.tag }}
          draft: false
          make_latest: true
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
          files: bundles/*
