name: Release

# A push to main that changes the version in src/Cargo.toml is a release:
# this builds ClipCut for macOS (Apple silicon and Intel) and Windows and
# publishes a GitHub release tagged v<version>, with one installer per
# target, a manifest.json and a checksum file. A push that leaves the
# version at one already released builds nothing.
#
# To ship a new version: change `version` in src/Cargo.toml, commit, push.
#
# It runs on main, not on a tag, so that every release shares one build
# cache: GitHub lets a run read the caches of its own ref and of the
# default branch only, so a run on a tag starts cold every time, and a
# cold build is most of an hour. On main the dependencies - Skia, Slint,
# whisper, the FFmpeg bindings - are compiled once and reused.
#
# The bundles are self-contained: the macOS .dmg carries its FFmpeg dylibs
# and is notarised when the signing secrets are set (ad-hoc signed
# otherwise); the Windows installers carry the FFmpeg runtime libraries
# beside the program. Nothing is published until every bundle has been
# launched where it was built: build-app.yml starts each one (`--version`,
# `--smoke`, and on x86_64 under an emulated Ivy Bridge) before it uploads
# it, and a bundle that does not start fails its job, which `publish`
# needs. The test suite runs on every push to main (ci.yml), not again
# here.
#
# Windows and the Macs build side by side and each publishes the moment it
# is ready: the Windows build is the quicker one, so Windows users get the
# update without waiting on the Macs. Whichever finishes first creates the
# release; the other adds its files to it and its rows to manifest.json.
# The in-app updater (Settings > Version) reads the published releases, so
# every installed copy offers the new version from then on; a Mac sees it
# once its own disk image is there.
on:
  push:
    branches: [main]
    paths:
      - src/Cargo.toml
  # By hand, from the Actions page: releases the version on main if it has
  # not been released yet. For a release whose run failed.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this version released yet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::src/Cargo.toml's version '$version' is not three numbers (1.2.3)"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released: nothing to build."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag is not released yet: building it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The commit this run started on, named outright, so the bundles and the
  # tag the release creates are the same tree.
  build-windows:
    name: build windows
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ github.sha }}
      platform: windows
    secrets: inherit

  build-macos:
    name: build macos
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ github.sha }}
      platform: macos
    secrets: inherit

  publish-windows:
    name: Publish Windows
    needs: [check, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          pattern: ClipCut-windows-*
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: source
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ github.sha }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
        run: source/.github/publish-release.sh

  # Waits for the Windows publish only so the two never write the release
  # at the same moment; it runs whether or not Windows made it.
  publish-macos:
    name: Publish macOS
    needs: [check, build-macos, publish-windows]
    if: ${{ !cancelled() && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          pattern: ClipCut-macos-*
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: source
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ github.sha }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
        run: source/.github/publish-release.sh
